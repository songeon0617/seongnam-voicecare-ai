name: Offline regression
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PUBLIC_INFORMATION_AI_ENABLED: "false"
      PUBLIC_INFORMATION_WEB_SEARCH_ENABLED: "false"
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
