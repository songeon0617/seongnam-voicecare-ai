name: Archive verification
on: workflow_dispatch
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PUBLIC_INFORMATION_AI_ENABLED: "false"
      PUBLIC_INFORMATION_WEB_SEARCH_ENABLED: "false"
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Historical functional suites remain in the repository. The archived
      # application intentionally rejects requests those suites expected to serve.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:archive
      - run: npm run build
